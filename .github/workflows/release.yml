# Publishes grouch-skill to npm via OIDC trusted publishing. No tokens.
# Trigger: push a version tag, e.g. `git tag v0.1.0 && git push --tags`
# (after pushing the version bump commit to main).
#
# One-time setup (package owner, on npmjs.com or via CLI):
#   npm trust github grouch-skill \
#     --repository IcanBENCHurCAT/grouch \
#     --file release.yml \
#     --allow-publish
# Requires interactive npm 2FA; cannot run unattended.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm publish --provenance --access public
